<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">WarpStations</title>
  <desc id="description">A navy and violet feature card with an illustration of a Linux desktop running in a browser.</desc>
